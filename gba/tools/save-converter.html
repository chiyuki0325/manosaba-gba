globalThis.SaveConverter=SaveConverter;
const file=document.getElementById('file'),target=document.getElementById('target'),status=document.getElementById('status'),mapping=document.getElementById('mapping'),slots=document.getElementById('slots'),download=document.getElementById('download');
let parsed,inputName;
function selection(){return [...slots.querySelectorAll('select')].map(s=>Number(s.value))}
function update(){
 if(!parsed)return;mapping.hidden=target.value!=='sram'||parsed.backend==='sram';const chosen=selection();
 const omitted=[...parsed.records.keys()].filter(n=>n<27&&!chosen.includes(n));
 document.getElementById('omitted').textContent=omitted.length?'未迁移的原手动槽：'+omitted.map(n=>String(n+1).padStart(2,'0')).join('、'):'所有已有手动档均已选中。';
 download.disabled=!mapping.hidden&&new Set(chosen).size!==8;
 const label=parsed.backend==='flash'?'Flash128K':'SRAM 32 KiB';
 status.textContent='已识别：'+label+'。'+(parsed.damaged?' 已忽略'+parsed.damaged+'条校验失败的记录。':'')+(download.disabled?' 同一个原槽不能重复选择。':'');

target.addEventListener('change',update);
file.addEventListener('change',async()=>{
 parsed=null;mapping.hidden=true;download.disabled=true;
 try{
  const f=file.files[0];if(!f)return;inputName=f.name;parsed=SaveConverter.parse(new Uint8Array(await f.arrayBuffer()));
  target.value=parsed.backend==='flash'?'sram':'flash';slots.replaceChildren();
  for(let i=0;i<8;i++){
   const label=document.createElement('label');label.textContent=`新手动槽 ${i+1} ← 原槽`;const select=document.createElement('select');
   for(let n=0;n<parsed.manualSlots;n++){const option=document.createElement('option');option.value=n;option.textContent=String(n+1).padStart(2,'0')+' · '+SaveConverter.caption(parsed.records.get(n));select.append(option)}
   select.value=i;select.addEventListener('change',update);label.append(select);slots.append(label);
  }
  update();
 }catch(e){parsed=null;status.textContent=e.message}
});
download.addEventListener('click',()=>{
 try{
  const bytes=SaveConverter.convert(parsed,selection(),target.value),url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'})),a=document.createElement('a');
  const ext=inputName.toLowerCase().endsWith('.srm')?'srm':'sav';a.href=url;a.download=inputName.replace(/\.(sav|srm)$/i,'')+'.'+target.value+'.'+ext;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),10000);status.textContent='已生成 '+(target.value==='flash'?'128 KiB Flash':'32 KiB SRAM')+'存档。原文件未修改。';
